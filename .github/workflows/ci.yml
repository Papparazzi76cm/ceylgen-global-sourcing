name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Lint report
        continue-on-error: true
        run: npm run lint

      - name: Explain lint baseline
        if: always()
        run: |
          echo "Build is the blocking quality gate."
          echo "Lint is temporarily informational because the imported codebase contains a large pre-existing formatting and rule backlog."
          echo "The lint backlog must be reduced in a dedicated cleanup phase before lint becomes blocking."
